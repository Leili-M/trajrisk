project:
  name: trajrisk
  seed: 42
paths:
  data_dir: data/movielens
  output_dir: outputs/movielens
data:
  dataset: movielens
  drop_ratings: []
  positive_ratings:
  - 4.0
  - 5.0
  min_item_train_positives: 5
  split:
    method: event_quantile
    train_end: '2000-11-22 03:06:26'
    valid_model_end: '2000-11-26 06:42:19'
    valid_end: '2000-12-02 14:52:18'
model:
  dims:
  - 1000
  emb_size: 10
  steps: 5
  noise_schedule: linear-var
  noise_scale: 0.0001
  noise_min: 0.0005
  noise_max: 0.005
  reweight: true
train:
  batch_size: 400
  lr: 0.0001
  weight_decay: 0.0
  max_epochs: 200
  eval_every: 5
  patience: 4
  select_metric: ndcg@10
evaluation:
  k: 10
  ks:
  - 10
  - 20
  - 50
  - 100
  exclude_seen: true
