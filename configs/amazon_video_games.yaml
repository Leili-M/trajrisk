project:
  name: trajrisk
  seed: 42
paths:
  data_dir: data/amazon_video_games
  output_dir: outputs/amazon_video_games
data:
  dataset: amazon
  drop_ratings: []
  positive_ratings:
  - 4.0
  - 5.0
  min_item_train_positives: 5
  split:
    method: event_quantile
    train_end: '2018-08-21 20:11:02.455'
    valid_model_end: '2019-04-07 12:15:06.767'
    valid_end: '2019-12-10 03:23:20.749'
  raw_file: Video_Games.csv.gz
model:
  dims:
  - 1000
  emb_size: 10
  steps: 5
  noise_schedule: linear-var
  noise_scale: 0.0001
  noise_min: 0.0005
  noise_max: 0.005
  reweight: true
train:
  batch_size: 400
  lr: 0.0001
  weight_decay: 0.0
  max_epochs: 200
  eval_every: 5
  patience: 4
  select_metric: ndcg@10
evaluation:
  k: 10
  ks:
  - 10
  - 20
  - 50
  - 100
  exclude_seen: true
