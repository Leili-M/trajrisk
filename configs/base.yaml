# Main settings for the whole project.
# Relative paths start from the project folder.

project:
  name: trajrisk
  seed: 42

paths:
  data_dir: data
  output_dir: outputs

data:
  dataset: hummus
  drop_ratings: [6.0]             # rating 6 = recipe author (Stage 1)
  positive_ratings: [4.0, 5.0]    # rating 2.5 pending supervisor
  min_item_train_positives: 5     # Stage 2
  split:
    method: event_quantile        # Stage 1
    train_end: "2010-07-05"
    valid_model_end: "2011-04-02"
    valid_end: "2012-02-23"

model:                            # official DiffRec, commit e42532f
  dims: [1000]
  emb_size: 10
  steps: 5
  noise_schedule: linear-var
  noise_scale: 0.0001
  noise_min: 0.0005
  noise_max: 0.005
  reweight: true

train:
  batch_size: 400
  lr: 0.0001
  weight_decay: 0.0
  max_epochs: 200
  eval_every: 5
  patience: 4
  select_metric: ndcg@10

evaluation:
  k: 10
  ks: [10, 20, 50, 100]
  exclude_seen: true
