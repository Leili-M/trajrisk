# Main settings for the whole project.
# Relative paths start from the project folder.

project:
  name: trajrisk
  seed: 42                        # one fixed seed for every random step

paths:
  data_dir: data
  output_dir: outputs

data:
  dataset: hummus
  drop_ratings: [6.0]             # rating 6 = user is the recipe's author (Stage 1)
  positive_ratings: [4.0, 5.0]    # rating 2.5 handling still pending supervisor
  min_item_train_positives: 5     # keep recipes with >= 5 training positives (Stage 2)
  split:
    method: event_quantile        # 70/10/20 of interactions, not of time (Stage 1)
    train_end: "2010-07-05"       # train:       date <= train_end
    valid_model_end: "2011-04-02" # valid_model: train_end < date <= valid_model_end
    valid_end: "2012-02-23"       # valid_risk:  valid_model_end < date <= valid_end
                                  # test:        date > valid_end

model:                            # official DiffRec, commit e42532f, used unchanged
  dims: [1000]
  emb_size: 10
  steps: 5                        # authors' Amazon-book
